<!doctype html>
<html class="light" lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Login to your Dreamsdesk account — Track. Collaborate. Deliver." />
    <title>Dreamsdesk</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <script>
      window.addEventListener('error', function(e) {
        if (e.message && (e.message.indexOf('Failed to load module script') !== -1 || e.message.indexOf('MIME type') !== -1)) {
          console.warn('Deployment update detected, reloading page...');
          window.location.reload();
        }
      }, true);
      window.addEventListener('unhandledrejection', function(e) {
        if (e.reason && (String(e.reason).indexOf('ChunkLoadError') !== -1 || String(e.reason).indexOf('Failed to fetch dynamically imported module') !== -1 || String(e.reason).indexOf('MIME type') !== -1)) {
          console.warn('Dynamic chunk load error detected, reloading page...');
          window.location.reload();
        }
      });
    </script>
  </head>
  <body class="bg-surface text-on-surface overflow-hidden font-['Inter']">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
